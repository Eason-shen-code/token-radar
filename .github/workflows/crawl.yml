name: token-radar-crawl

# 两条定时，都是 UTC，换算北京时间见注释
# 主触发 21:30 UTC = 北京 05:30
# 兜底   19:30 UTC = 北京 03:30（GitHub 排队延迟实测可达 6 小时，多一条提高准时概率）
# 写入按日期 upsert，重复跑不会写坏数据
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 19 * * *'
  workflow_dispatch:

concurrency:
  group: token-radar-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 自检只输出令牌长度和哈希前缀，不输出令牌本身
      - name: 环境自检
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          set +e
          echo "端点连通性：$(curl -sS -o /dev/null -w '%{http_code}' -m 20 https://ai-token-price-radar.app.workbuddy.host/ 2>&1)"
          if [ -z "$INGEST_TOKEN" ]; then
            echo "::error::INGEST_TOKEN 为空——仓库 Secret 没有配置，或名字拼错（必须正好是 INGEST_TOKEN）"
            exit 1
          fi
          echo "令牌长度：${#INGEST_TOKEN}（应为 48）"
          echo "令牌指纹：$(printf '%s' "$INGEST_TOKEN" | sha256sum | cut -c1-12)（应为 b0d827fdbd8b）"

      - name: 抓取各平台价格
        run: node scripts/run.mjs

      - name: 推送到云端数据库
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: node scripts/push.mjs

      - name: 留存本次结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: |
            data/latest.json
            data/changelog.json
          retention-days: 30
