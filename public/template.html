<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2137">
<title>AI算力价格监测台</title>
<script>/*__SDK__*/</script>
<script>
  // 云服务公开配置（publishableKey 仅标识应用，无权限，服务端强制同源校验）
  window.__CLOUD_CFG = {
    endpoint: "https://ai-token-price-radar.app.workbuddy.host",
    oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
    publishableKey: "wbpk_WrIQWYOUJjbr1mwyDHziWZ_hFp2n35XQIMB21DcqEcxNfy1Aatjgmeo"
  };
</script>
<style>
:root{
  --bg:#f2f5f9; --card:#fff; --card2:#f8fafc; --line:#e3e9f1;
  --tx:#132133; --tx2:#5b6b80; --tx3:#8b9aad;
  --brand:#12304f; --brand2:#1f4d79; --accent:#e0761c;
  --up:#cf3f32; --down:#12855c; --warn:#b8860b;
  --r:14px; --sh:0 1px 2px rgba(16,38,62,.06),0 4px 16px rgba(16,38,62,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1219; --card:#131c26; --card2:#0f1720; --line:#22303f;
    --tx:#e7eef6; --tx2:#96a7ba; --tx3:#6d7f93;
    --brand:#0b1219; --brand2:#16283c; --accent:#f0952f;
    --up:#ff6b5e; --down:#31c48d; --warn:#e0b341;
    --sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--tx);line-height:1.55;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* 顶栏 */
.top{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,var(--brand),var(--brand2));
  color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;
  box-shadow:0 2px 12px rgba(10,25,42,.18);
}
.top .row{display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto}
.top h1{font-size:16px;font-weight:700;letter-spacing:.4px;flex:1}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:3px 9px;border-radius:20px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;background:#3ddc84;box-shadow:0 0 6px #3ddc84}
.dot.warn{background:#ffc046;box-shadow:0 0 6px #ffc046}
.dot.err{background:#ff7b6b;box-shadow:0 0 6px #ff7b6b}
.top .sub{
  max-width:720px;margin:8px auto 0;display:flex;flex-wrap:wrap;gap:6px 14px;
  font-size:11.5px;color:rgba(255,255,255,.72);
}
.top .sub b{color:#ffd9a8;font-weight:600}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin:14px 0;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line)}
.ch .idx{
  width:20px;height:20px;border-radius:6px;background:var(--brand2);color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;
}
.ch h2{font-size:14px;font-weight:700;flex:1;letter-spacing:.2px}
.ch .more{font-size:11.5px;color:var(--tx3)}
.cb{padding:0 14px 14px}
.hint{font-size:11.5px;color:var(--tx3);padding:12px 0 2px;line-height:1.6}

/* 概览格 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px 4px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:center}
.stat .n{font-size:18px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .l{font-size:10.5px;color:var(--tx3);margin-top:1px}
.stat.hot .n{color:var(--up)}

/* 变动条目 */
.diff{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.diff:last-child{border-bottom:none}
.diff .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px}
.diff .ic.up{background:rgba(207,63,50,.12);color:var(--up)}
.diff .ic.down{background:rgba(18,133,92,.12);color:var(--down)}
.diff .ic.watch{background:rgba(184,134,11,.14);color:var(--warn)}
.diff .m{flex:1;min-width:0}
.diff .t{font-size:13px;font-weight:600;line-height:1.4}
.diff .v{font-size:12px;color:var(--tx2);margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-word}
.diff .v em{font-style:normal;color:var(--tx3)}
.diff .p{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center}
.p.up{color:var(--up)} .p.down{color:var(--down)}

/* 报价行 */
.quote{padding:11px 0;border-bottom:1px solid var(--line)}
.quote:last-child{border-bottom:none}
.qh{display:flex;align-items:baseline;gap:8px}
.qh .nm{font-size:13px;font-weight:600;flex:1;min-width:0;line-height:1.35;word-break:break-word}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:11.5px;padding:4px 11px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--tx2);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--card2);border-color:var(--tx3);color:var(--tx);font-weight:600}
.chartbox{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px 8px;margin:6px 0}
.chline{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;color:var(--tx3);margin-top:4px}
.legend i{display:inline-block;width:9px;height:2px;vertical-align:middle;margin-right:4px;border-radius:1px}
.rankwrap{border-bottom:1px solid var(--line);padding:9px 0}
.rankwrap:last-of-type{border-bottom:none}
.rankwrap .rank{padding:0;border-bottom:none}
.rank{display:flex;gap:9px;align-items:flex-start;padding:0}
.rn{width:20px;flex:0 0 20px;font-size:11px;color:var(--tx3);text-align:right;padding-top:3px;font-variant-numeric:tabular-nums}
.rn.top{color:var(--accent);font-weight:700}
.rm{flex:1;min-width:0}
.rt{font-size:12.5px;font-weight:600;line-height:1.4}
.rt .plat{font-weight:400;color:var(--tx2);font-size:11.5px}
.rs2{font-size:11px;color:var(--tx3);margin-top:1px;font-variant-numeric:tabular-nums}
.rbar{height:3px;border-radius:2px;background:var(--card2);margin-top:5px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:2px}
.rbar i.plan{background:linear-gradient(90deg,#b9822e,#e0a04a)}
.rbar i.meter{background:linear-gradient(90deg,#2f6fa8,#4f9fd8)}
.rp{font-size:13px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.rp span{font-size:10px;font-weight:500;color:var(--tx3)}
.promo{background:rgba(224,118,28,.06);border:1px solid rgba(224,118,28,.25);border-radius:9px;padding:10px 11px;margin:4px 0 2px}
.promo .ptitle{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.promo .pname{font-size:12.5px;color:var(--tx);margin-bottom:6px;line-height:1.4}
.kv{display:flex;gap:10px;font-size:11.5px;padding:2px 0;font-variant-numeric:tabular-nums}
.kv span{color:var(--tx3);flex:0 0 72px}
.kv b{color:var(--tx);font-weight:600;flex:1;word-break:break-word}
.plinks{display:flex;gap:12px;margin-top:6px;font-size:11.5px}
.plinks a{color:var(--accent);text-decoration:none;border-bottom:1px dotted rgba(224,118,28,.5)}
.src-tag{display:inline-block;font-size:9.5px;padding:0 5px;border-radius:4px;margin-right:6px;vertical-align:1px;letter-spacing:.2px}
.src-tag.live{background:rgba(55,138,221,.14);color:#3d7fc4;border:1px solid rgba(55,138,221,.3)}
.src-tag.plan{background:rgba(224,118,28,.14);color:#c96a12;border:1px solid rgba(224,118,28,.3)}
.bar i.meter{background:linear-gradient(90deg,#2f6fa8,#4f9fd8)}
.bar i.plan{background:linear-gradient(90deg,#b9822e,#e0a04a)}
.gapbar{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--tx2);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.gapbar b{color:var(--tx);font-weight:600}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.badge.up{background:rgba(207,63,50,.14);color:var(--up);border:1px solid rgba(207,63,50,.28)}
.badge.down{background:rgba(18,133,92,.14);color:var(--down);border:1px solid rgba(18,133,92,.28)}
.caret{flex-shrink:0;align-self:center;color:var(--tx3);font-size:10px;line-height:1}
.quote{cursor:pointer}
.detail{display:none;margin:10px -2px 2px;padding-top:10px;border-top:1px dashed var(--line);cursor:default}
.quote.open .detail{display:block}
.qh .pr{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.3px;white-space:nowrap;flex-shrink:0}
.qh .pr span{font-size:10.5px;font-weight:500;color:var(--tx3);margin-left:1px}
.bar{height:4px;border-radius:3px;background:var(--card2);margin:7px 0 5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--brand2),var(--accent))}
.qm{font-size:11px;color:var(--tx3);display:flex;flex-wrap:wrap;gap:3px 10px;font-variant-numeric:tabular-nums}
.qm b{color:var(--tx2);font-weight:600}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--tx2);background:var(--card2);margin-left:6px;vertical-align:1px}
.tag.live{border-color:rgba(18,133,92,.35);color:var(--down);background:rgba(18,133,92,.08)}
.tag.base{border-color:rgba(224,118,28,.35);color:var(--accent);background:rgba(224,118,28,.08)}
.tag.pend{border-color:var(--line);color:var(--tx3)}
.tag.no{border-color:rgba(207,63,50,.3);color:var(--up);background:rgba(207,63,50,.07)}

/* Tab */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;font-size:12px;padding:6px 12px;border-radius:20px;
  border:1px solid var(--line);background:var(--card2);color:var(--tx2);white-space:nowrap;cursor:pointer;
  transition:.15s;
}
.tab.on{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:600}
.seg{display:flex;gap:6px;padding:0 14px 4px}
.seg button{font-size:11.5px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--tx3);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx);border-color:var(--tx3)}

/* 监控表 */
.wt{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.wt:last-child{border-bottom:none}
.wt .st{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.wt .st.ok{background:var(--down)} .wt .st.dynamic{background:var(--warn)} .wt .st.fail{background:var(--up)}
.wt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt .rs{font-size:11px;color:var(--tx3);white-space:nowrap}
.wt .rs.chg{color:var(--warn);font-weight:600}

/* 折叠 */
details{border-top:1px solid var(--line)}
details summary{
  list-style:none;cursor:pointer;padding:11px 0;font-size:12.5px;color:var(--tx2);
  display:flex;align-items:center;justify-content:space-between;
}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'＋';color:var(--tx3);font-size:13px}
details[open] summary::after{content:'－'}
.src{font-size:11.5px;color:var(--tx3);padding:7px 0;border-bottom:1px dashed var(--line);line-height:1.55;word-break:break-all}
.src:last-child{border-bottom:none}
.src a{color:var(--brand2);text-decoration:none}
@media (prefers-color-scheme: dark){.src a{color:#6fa8dc}}

.foot{text-align:center;font-size:11px;color:var(--tx3);padding:18px 0 6px;line-height:1.9}
.btn{
  display:block;width:100%;margin-top:12px;padding:11px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;
}
.btn:active{transform:scale(.99)}
@media(min-width:760px){ .wrap{padding:0 20px} .top h1{font-size:17px} }
</style>
</head>
<body>

<div class="top">
  <div class="row">
    <h1>AI算力价格监测台</h1>
    <span class="pill" id="cloudPill"><i class="dot" id="cloudDot"></i><span id="cloudTag">连接云端</span></span>
  </div>
  <div class="sub">
    <span>数据时间 <b id="stamp">—</b></span>
    <span>下次抓取 <b>每日 05:30</b></span>
  </div>
</div>

<div class="wrap">
  <div id="app"></div>
  <div class="foot">
    价格数据由脚本自动抓取自各平台官方文档页<br>
    抓取与分析口径见文末说明 · 仅供内部比价参考
  </div>
</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('payload').textContent);
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // 单价：元/百万Token，固定两位
  const u2 = v => (v==null||isNaN(v)) ? '—' : Number(v).toFixed(2);
  // 金额：月费等，去掉无意义的尾零
  const money = v => {
    if(v==null||isNaN(v)) return '—';
    const a=Math.abs(v);
    if(a>=1000) return Number(v).toLocaleString('zh-CN',{maximumFractionDigits:0});
    if(a>=100) return Number(v).toFixed(1).replace(/\.0$/,'');
    return Number(v).toFixed(2).replace(/0$/,'').replace(/\.$/,'');
  };

  $('#stamp').textContent = D.stamp;

  /* ---------------- 云服务：价格历史 ---------------- */
  const CFG = window.__CLOUD_CFG || {};
  const CLOUD = { status: 'loading', note: '', snaps: [], trend: [] };
  const num = v => (v == null || v === '' || isNaN(Number(v))) ? null : Number(v);

  function setCloud(state, text){
    const dot = $('#cloudDot'), tag = $('#cloudTag');
    if(!dot || !tag) return;
    dot.className = 'dot' + (state === 'ok' ? '' : (state === 'loading' ? ' warn' : ' err'));
    tag.textContent = text;
  }

  function computeCompare(histRows, todayQuotes, todayDate){
    const EPS = 0.0001;
    if(!histRows || !histRows.length) return null;
    const dates = [...new Set(histRows.map(x => x.date))].sort().reverse();
    const prevDate = dates.find(d => d < todayDate);
    if(!prevDate) return null;

    const byKey = new Map();
    histRows.forEach(r => {
      if(!byKey.has(r.key)) byKey.set(r.key, []);
      byKey.get(r.key).push(r);
    });
    byKey.forEach(arr => arr.sort((a, b) => b.date.localeCompare(a.date)));

    const prevOf = k => (byKey.get(k) || []).find(x => x.date === prevDate);
    const pctOf = (a, b) => (a ? Math.round((b - a) / a * 1000) / 10 : null);

    const changes = [];
    todayQuotes.forEach(q => {
      const p = prevOf(q.key);
      if(!p) return;
      [['官方综合单价', q.blended, p.blended],
       ['输入价', q.input, p.input],
       ['输出价', q.output, p.output],
       ['缓存命中价', q.inputCacheHit, p.cacheHit]].forEach(([name, cur, old]) => {
        if(cur == null || old == null || Math.abs(cur - old) <= EPS) return;
        changes.push({ key:q.key, label:q.label, field:name, from:old, to:cur, pct:pctOf(old, cur), kind: cur > old ? 'up' : 'down' });
      });
    });

    const streaks = [];
    todayQuotes.forEach(q => {
      const arr = (byKey.get(q.key) || []).filter(x => x.date < todayDate);
      if(q.blended == null) return;
      let days = 1, since = todayDate;
      for(const h of arr){
        if(h.blended != null && Math.abs(h.blended - q.blended) <= EPS){ days++; since = h.date; }
        else break;
      }
      if(days >= 2) streaks.push({ key:q.key, label:q.label, days, since, blended:q.blended });
    });
    streaks.sort((a, b) => b.days - a.days || a.blended - b.blended);

    return { available:true, lastDate:prevDate, lastLabel:'上一次抓取 ' + prevDate, changes, streaks, note:null };
  }

  async function loadCloud(){
    if(!window.WorkBuddyCloud || !CFG.endpoint || !CFG.publishableKey){
      CLOUD.status = 'fail';
      CLOUD.note = '云端客户端未加载，当前展示页面内置快照';
      setCloud('err', '云端离线');
      render();
      return;
    }
    try{
      const cloud = WorkBuddyCloud.createWorkBuddyCloud({
        endpoint: CFG.endpoint,
        oauthRelayBaseUrl: CFG.oauthRelayBaseUrl,
        publishableKey: CFG.publishableKey
      });
      const db = cloud.database;

      const r1 = await db.from('price_snapshots')
        .select('as_of_date,stamp,baseline_version,quote_count,diff_count,a_ok,a_fail,b_ok,b_fail')
        .order('as_of_date', { ascending: false }).limit(30);
      if(r1.error) throw r1.error;

      const snaps = (r1.data || []).map(s => Object.assign({}, s, { date: String(s.as_of_date).slice(0, 10) }));
      if(!snaps.length){
        CLOUD.status = 'empty';
        CLOUD.note = '云端尚无历史快照，当前展示页面内置数据';
        setCloud('warn', '云端无数据');
        render();
        return;
      }

      const latest = snaps[0].date;
      const [rq, rt] = await Promise.all([
        db.from('price_quotes').select('*').eq('as_of_date', latest).order('blended', { ascending: true }),
        db.from('price_quotes').select('as_of_date,quote_key,label,input_price,cache_hit_price,output_price,blended').order('as_of_date', { ascending: true }).limit(800)
      ]);
      if(rq.error) throw rq.error;

      const quotes = (rq.data || []).map(r => ({
        key: r.quote_key, label: r.label, source: r.source, billing: r.billing,
        input: num(r.input_price), inputCacheHit: num(r.cache_hit_price),
        output: num(r.output_price), blended: num(r.blended), unit: r.unit
      })).filter(q => q.blended != null);

      if(quotes.length) D.liveQuotes = quotes;
      D.stamp = snaps[0].stamp || D.stamp;
      D.health = {
        aOk: snaps[0].a_ok || 0, aFail: snaps[0].a_fail || 0,
        bOk: snaps[0].b_ok || 0, bFail: snaps[0].b_fail || 0
      };

      CLOUD.snaps = snaps;
      const histRows = (rt.data || []).map(r => ({
        date: String(r.as_of_date).slice(0, 10), key: r.quote_key, label: r.label,
        input: num(r.input_price), cacheHit: num(r.cache_hit_price),
        output: num(r.output_price), blended: num(r.blended)
      }));
      CLOUD.trend = histRows.filter(x => x.blended != null).map(x => ({ date: x.date, key: x.key, v: x.blended }));

      // 本期变动由云端历史现算，不依赖页面构建时间
      const cmp = computeCompare(histRows, quotes, latest);
      if(cmp) D.compare = cmp;
      CLOUD.status = 'ok';
      CLOUD.note = '';

      $('#stamp').textContent = D.stamp;
      setCloud('ok', '云端已同步');
      render();
    }catch(e){
      let msg = e && (e.message || e.hint || e.error_description || e.error || e.code);
      if(!msg){ try { msg = JSON.stringify(e).slice(0, 90); } catch(_) { msg = ''; } }
      if(!msg) msg = '网络或凭证异常';
      CLOUD.status = 'fail';
      CLOUD.note = '云端读取失败（' + msg + '），已回退到页面内置快照';
      setCloud('err', '云端离线');
      render();
    }
  }

  const VER = {
    measured:  ['base', '已实测'],
    nominal:   ['base', '标称口径'],
    unverified:['pend', '未实测'],
    pending:   ['pend', '待实测'],
    unsupported:['no', '不支持']
  };

  let curOrder = 'promo';

  function unitOf(r){ return curOrder==='normal' ? (r.unitPriceNormal ?? r.unitPrice) : (r.unitPrice ?? r.unitPriceNormal); }

  function head(){
    const h = D.health;
    const C = D.compare;
    const hi = C && C.available ? new Set(C.changes.map(c=>c.key)).size : 0;
    return `<div class="card">
      <div class="stats">
        <div class="stat"><div class="n">${h.aOk+h.bOk}</div><div class="l">数据源正常</div></div>
        <div class="stat ${hi?'hot':''}"><div class="n">${hi}</div><div class="l">今日调价</div></div>
        <div class="stat"><div class="n">${D.liveQuotes.length}</div><div class="l">实时官方报价</div></div>
      </div>
      <div class="cb"><div class="hint">A 级源每次运行自动覆盖，B 级源仅监控页面变更，C 级为无公开价格的政企报价。当前抓取成功率 ${h.aOk}/${h.aOk+h.aFail}（A级）、${h.bOk}/${h.bOk+h.bFail}（B级）。</div></div>
    </div>`;
  }

  function keySeries(k){
    return (CLOUD.trend || []).filter(x => x.key === k).sort((a, b) => a.date.localeCompare(b.date));
  }

  function miniChart(pts, color){
    if(pts.length < 2) return '<div class="hint" style="padding:6px 0">云端历史不足 2 次记录，暂无法绘制走势。</div>';
    const W = 300, H = 96, PL = 34, PR = 8, PT = 12, PB = 20;
    const vs = pts.map(p => p.v);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    const span = (hi - lo) || (hi * 0.4) || 1;
    lo = Math.max(0, lo - span * 0.2); hi = hi + span * 0.2;
    const X = i => PL + i * (W - PL - PR) / (pts.length - 1);
    const Y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
    const poly = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    const grid = [lo, hi].map(v =>
      `<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W - PR}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
       <text x="${PL - 5}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--tx3)">${v.toFixed(2)}</text>`
    ).join('');
    const dots = pts.map((p, i) =>
      `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 3 : 1.8}" fill="${color}"/>`).join('');
    const xl = `<text x="${PL}" y="${H - 6}" font-size="8" fill="var(--tx3)">${pts[0].date.slice(5)}</text>
      <text x="${W - PR}" y="${H - 6}" text-anchor="end" font-size="8" fill="var(--tx3)">${pts[pts.length - 1].date.slice(5)}</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}
      <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
  }

  const QUOTE_META = {
    'zhipu:GLM-5.3':                ['智谱', 'glm-5.3', 'GLM-5.3'],
    'zhipu:GLM-5.3-Flash':          ['智谱', 'glm-5.3-flash', 'GLM-5.3-Flash'],
    'zhipu:GLM-5.3-FlashX':         ['智谱', 'glm-5.3-flashx', 'GLM-5.3-FlashX'],
    'deepseek:deepseek-v4-pro:off':   ['DeepSeek', 'deepseek-v4-pro', 'V4 Pro'],
    'deepseek:deepseek-v4-pro:peak':  ['DeepSeek', 'deepseek-v4-pro', 'V4 Pro'],
    'deepseek:deepseek-v41-flash:off':  ['DeepSeek', 'deepseek-v41-flash', 'V4.1 Flash'],
    'deepseek:deepseek-v41-flash:peak': ['DeepSeek', 'deepseek-v41-flash', 'V4.1 Flash']
  };
  const VENDOR_ORDER = ['智谱', 'DeepSeek', '字节跳动', '阿里', '月之暗面'];

  let curVendor = '智谱';
  let curModelId = 'glm-5.3';

  function buildCatalog(){
    const vendors = new Map();
    const touch = (v, mid, label) => {
      if(!vendors.has(v)) vendors.set(v, new Map());
      const ms = vendors.get(v);
      if(!ms.has(mid)) ms.set(mid, { id: mid, label, rows: [], quotes: [] });
      return ms.get(mid);
    };

    (D.models || []).forEach(fam => (fam.rows || []).forEach(r => {
      const v = r.vendor || '其他';
      const mid = r.model || fam.id;
      const lab = r.modelLabel || fam.name || mid;
      touch(v, mid, lab).rows.push(r);
    }));

    (D.liveQuotes || []).forEach(q => {
      const meta = QUOTE_META[q.key];
      if(!meta) return;
      touch(meta[0], meta[1], meta[2]).quotes.push(q);
    });

    const list = [...vendors.entries()].map(([name, ms]) => ({
      name,
      models: [...ms.values()].sort((a, b) => {
        const av = [...a.rows.map(unitOf), ...a.quotes.map(q => q.blended)].filter(x => x != null).sort((x, y) => x - y)[0];
        const bv = [...b.rows.map(unitOf), ...b.quotes.map(q => q.blended)].filter(x => x != null).sort((x, y) => x - y)[0];
        return (av ?? 1e9) - (bv ?? 1e9);
      })
    }));
    list.sort((a, b) => {
      const ai = VENDOR_ORDER.indexOf(a.name), bi = VENDOR_ORDER.indexOf(b.name);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
    return list;
  }

  function meterDetail(q, C){
    const mine = C.changes.filter(c => c.key === q.key);
    const main = mine.find(c => c.field === '官方综合单价') || mine[0];
    const pts = keySeries(q.key);
    const svg = pts.length >= 2 ? miniChart(pts, main ? (main.kind === 'up' ? 'var(--up)' : 'var(--down)') : '#e0761c') : '';
    const det = mine.filter(c => c !== main).map(c =>
      `<div class="wt"><i class="st ok"></i><span class="nm">${esc(c.field)}</span>
        <span class="rs" style="color:${c.kind === 'up' ? 'var(--up)' : 'var(--down)'}">¥${u2(c.from)} → ¥${u2(c.to)} · ${c.pct > 0 ? '+' : ''}${c.pct}%</span></div>`).join('');

    return `${svg ? `<div class="chline"><span>官方综合单价走势</span><span style="color:var(--tx3)">近 30 天窗口 · 已存档 ${pts.length} 天</span></div>${svg}
        ${pts.length >= 2 && pts.every(x => Math.abs(x.v - pts[0].v) < 1e-4)
          ? `<div class="hint" style="padding:2px 0 0">窗口内价格全程未变，恒定 ¥${u2(pts[0].v)}。</div>` : ''}`
      : `<div class="hint" style="padding:2px 0 6px">历史记录不足 2 天，暂无法绘制走势。</div>`}
      ${main ? `<div class="hint" style="padding:8px 0 2px">与${esc(C.lastLabel || '上一次抓取')}相比，本口径共 ${mine.length} 项调整：</div>${det}`
             : `<div class="hint" style="padding:8px 0 2px">与${esc(C.lastLabel || '上一次抓取')}相比，本口径价格无变化。</div>`}
      <div class="hint" style="padding:6px 0 0">数据来源：${esc(q.source || '—')} · 每日自动抓取</div>`;
  }

  function planDetail(r, u){
    const p = r.promo;
    const promoBlock = p ? `<div class="promo">
        <div class="ptitle">活动价 · ${esc(p.discount)}</div>
        <div class="pname">${esc(p.campaign)}</div>
        <div class="kv"><span>刊例价</span><b>¥${money(p.listPrice)}</b></div>
        <div class="kv"><span>活动价</span><b style="color:var(--accent)">¥${money(p.promoPrice)}</b></div>
        ${p.conditions ? `<div class="kv"><span>参与条件</span><b>${esc(p.conditions)}</b></div>` : ''}
        <div class="kv"><span>截止时间</span><b style="color:var(--tx3)">未记录，需到活动页确认</b></div>
        <div class="kv"><span>命名依据</span><b style="color:var(--tx2);font-weight:400">${esc(p.campaignBasis)}</b></div>
        <div class="plinks">
          <a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">活动页 →</a>
          ${p.ruleUrl ? `<a href="${esc(p.ruleUrl)}" target="_blank" rel="noopener">活动规则 →</a>` : ''}
        </div>
        <div class="hint" style="padding:4px 0 0">核验于 ${esc(p.verifiedAt)}。${esc(p.note)}</div>
      </div>` : '';

    const quota = r.monthlyTokens
      ? `${(r.monthlyTokens / 1e8).toFixed(2)} 亿 Token`
      : (r.verify === 'unsupported' ? '不支持该型号' : '按积分/Credits 计，无公开兑换率');

    return `${promoBlock}
      <div class="chline" style="margin-top:${p ? '10px' : '0'}"><span>套餐明细</span></div>
      <div class="kv"><span>月费</span><b>¥${money(r.priceMonthly)}${r.listMonthly && r.listMonthly > r.priceMonthly ? `（刊例 ¥${money(r.listMonthly)}）` : ''}</b></div>
      <div class="kv"><span>单账号月额度</span><b>${esc(quota)}</b></div>
      <div class="kv"><span>折算单价</span><b>¥${u == null ? '—' : u2(u)}/百万</b></div>
      ${r.note ? `<div class="kv"><span>备注</span><b style="font-weight:400;color:var(--tx2)">${esc(r.note)}</b></div>` : ''}
      <div class="hint" style="padding:8px 0 0">套餐价格为人工维护的报价快照，不是每日抓取，因此没有走势曲线。销售渠道：${esc(r.platform)}。</div>`;
  }

  function meteredRow(q, C, maxAll){
    const w = Math.max(2, (q.blended / maxAll) * 100);
    const mine = C.changes.filter(c => c.key === q.key);
    const main = mine.find(c => c.field === '官方综合单价') || mine[0];
    const todayLabel = D.stamp ? D.stamp.slice(5, 10) : '今日';
    const badge = main ? `<span class="badge ${main.kind}">${todayLabel} ${main.pct > 0 ? '+' : ''}${main.pct}%</span>` : '';
    const streak = (C.streaks || []).find(x => x.key === q.key);
    return `<div class="quote" data-k="${esc(q.key)}">
      <div class="qh">
        <div class="nm"><span class="src-tag live">按量·实时</span>${esc(q.label)}${badge}</div>
        <div class="pr">¥${u2(q.blended)}<span>/百万</span></div>
        <span class="caret">▾</span>
      </div>
      <div class="bar"><i class="meter" style="width:${w}%"></i></div>
      <div class="qm">
        <span>输入 <b>¥${u2(q.input)}</b></span>
        <span>缓存 <b>¥${u2(q.inputHit ?? q.inputCacheHit)}</b></span>
        <span>输出 <b>¥${u2(q.output)}</b></span>
        ${streak ? `<span style="color:var(--tx3)">连续 ${streak.days} 天未变</span>` : ''}
      </div>
      <div class="detail">${meterDetail(q, C)}</div>
    </div>`;
  }

  function planRow(r, maxAll){
    const u = unitOf(r);
    const w = u == null ? 0 : Math.max(1.5, (u / maxAll) * 100);
    const v = VER[r.verify] || ['pend', '待核'];
    const priceTxt = r.priceMonthly != null
      ? `¥${money(r.priceMonthly)}<span>/月</span>${r.listMonthly && r.listMonthly > r.priceMonthly ? ` <s style="font-size:10.5px;color:var(--tx3)">¥${money(r.listMonthly)}</s>` : ''}`
      : (r.priceIn != null ? `输入 ¥${u2(r.priceIn)} / 输出 ¥${u2(r.priceOut)}` : '—');
    return `<div class="quote">
      <div class="qh">
        <div class="nm"><span class="src-tag plan">套餐·人工</span>${esc(r.platform)} <span style="font-weight:400;color:var(--tx2);font-size:12px">${esc(r.product)}</span></div>
        <div class="pr">${u == null ? '<span style="font-size:12px;color:var(--tx3)">待核</span>' : '¥' + u2(u)}${u == null ? '' : '<span>/百万</span>'}</div>
        <span class="caret">▾</span>
      </div>
      <div class="bar"><i class="plan" style="width:${w}%"></i></div>
      <div class="qm">
        <span>${priceTxt}</span>
        <span>${esc(r.billing)}</span>
        ${r.modelNote ? `<span>${esc(r.modelNote)}</span>` : ''}
      </div>
      <div class="qm" style="margin-top:2px">
        <span class="tag ${v[0]}">${v[1]}</span>
        ${r.promo ? '<span class="tag" style="border-color:rgba(224,118,28,.35);color:var(--accent);background:rgba(224,118,28,.08)">有活动</span>' : ''}
        ${r.unitPriceNormal != null && r.unitPriceNormal !== r.unitPrice ? `<span>常态 ¥${u2(r.unitPriceNormal)}</span>` : ''}
      </div>
      <div class="detail">${planDetail(r, u)}</div>
    </div>`;
  }

  let rankFilter = 'all';
  let rankExpanded = false;

  function quoteSuffix(label){
    const m = label.match(/（(.+?)时段）/) || label.match(/（(.+?)）/);
    if(m) return ' · ' + m[1].replace('时段', '');
    return '';
  }

  function rankCard(){
    const C = D.compare || { available:false, changes:[], streaks:[], note:'' };
    const items = [];
    (D.models || []).forEach(fam => (fam.rows || []).forEach(r => {
      const v = unitOf(r);
      if(v == null) return;
      items.push({
        kind: 'plan', price: v, model: r.modelLabel || fam.name,
        where: r.platform, ref: r, promo: !!r.promo,
        sub: [r.product, r.priceMonthly != null ? '¥' + money(r.priceMonthly) + '/月' : '',
          r.monthlyTokens ? (r.monthlyTokens / 1e8).toFixed(1) + '亿' : ''].filter(Boolean).join(' · ')
      });
    }));
    (D.liveQuotes || []).forEach(q => {
      if(q.blended == null) return;
      const meta = QUOTE_META[q.key];
      items.push({
        kind: 'meter', price: q.blended, model: (meta ? meta[2] : q.label) + quoteSuffix(q.label),
        where: '官方 API', ref: q, promo: false,
        sub: '输入 ¥' + u2(q.input) + ' · 输出 ¥' + u2(q.output)
      });
    });

    const all = items.slice().sort((x, y) => x.price - y.price);
    const shown = all.filter(x => rankFilter === 'all' || x.kind === rankFilter);
    const list = rankExpanded ? shown : shown.slice(0, 12);
    const max = shown.length ? shown[shown.length - 1].price : 1;
    const mid = shown.length ? shown[Math.floor(shown.length / 2)].price : 0;

    const rows = list.map((x, i) => {
      const w = Math.max(3, Math.sqrt(x.price / max) * 100);
      const tag = x.kind === 'plan'
        ? `<span class="src-tag plan">套餐</span>` : `<span class="src-tag live">按量</span>`;
      const detail = x.kind === 'plan' ? planDetail(x.ref, x.price) : meterDetail(x.ref, C);
      return `<div class="quote rankwrap">
        <div class="rank">
          <div class="rn ${i < 3 ? 'top' : ''}">${i + 1}</div>
          <div class="rm">
            <div class="rt">${tag}${esc(x.model)} <span class="plat">${esc(x.where)}</span>${x.promo ? '<span class="tag" style="border-color:rgba(224,118,28,.35);color:var(--accent);background:rgba(224,118,28,.08);margin-left:5px">活动</span>' : ''}</div>
            <div class="rs2">${esc(x.sub)}</div>
            <div class="rbar"><i class="${x.kind}" style="width:${w.toFixed(1)}%"></i></div>
          </div>
          <div class="rp">¥${u2(x.price)}<span>/百万</span></div>
          <span class="caret">▾</span>
        </div>
        <div class="detail">${detail}</div>
      </div>`;
    }).join('');

    const chips = [['all', '全部'], ['plan', '仅套餐'], ['meter', '仅按量']].map(([k, n]) =>
      `<div class="chip ${rankFilter === k ? 'on' : ''}" data-r="${k}">${n}</div>`).join('');

    const more = shown.length > 12
      ? `<button class="btn" id="rankMore" style="margin-top:8px">${rankExpanded ? '收起' : `展开全部 ${shown.length} 条`}</button>`
      : '';

    const summary = shown.length
      ? `<div class="gapbar"><span>最低 <b>¥${u2(shown[0].price)}</b> · ${esc(shown[0].model)}</span>
          <span>中位 <b>¥${u2(mid)}</b></span>
          <span>最高 <b>¥${u2(shown[shown.length - 1].price)}</b></span></div>`
      : '';

    return `<div class="card">
      <div class="ch"><span class="idx">1</span><h2>全量价格排行</h2><span class="more">${shown.length} 个可选项</span></div>
      <div class="chips" id="rtabs">${chips}</div>
      <div class="cb">
        ${summary}
        <div class="hint" style="padding:6px 0 4px">所有套餐与官方按量价折算到同一把尺子上排序。点任意一行展开明细；跨型号比价只反映单位 token 成本，不代表能力相当。</div>
        ${rows}
        ${more}
      </div>
    </div>`;
  }

  function priceCard(){
    const C = D.compare || { available:false, changes:[], streaks:[], note:'' };
    const catalog = buildCatalog();
    let vendor = catalog.find(x => x.name === curVendor) || catalog[0];
    if(!vendor) return '';
    let model = vendor.models.find(x => x.id === curModelId) || vendor.models[0];
    if(!model) return '';
    curVendor = vendor.name; curModelId = model.id;

    const ordered = [
      ...model.quotes.map(q => ({ kind: 'm', v: q.blended, q })),
      ...model.rows.map(r => ({ kind: 'p', v: unitOf(r), r }))
    ].sort((a, b) => {
      if(a.v == null && b.v == null) return 0;
      if(a.v == null) return 1;
      if(b.v == null) return -1;
      return a.v - b.v;
    });
    const prices = ordered.map(o => o.v).filter(v => v != null);
    const maxAll = prices.length ? Math.max(...prices) : 1;
    const body = ordered.map(o => o.kind === 'm' ? meteredRow(o.q, C, maxAll) : planRow(o.r, maxAll)).join('');

    const bestPlan = model.rows.map(unitOf).filter(v => v != null).sort((a, b) => a - b)[0];
    const mainQuote = model.quotes.find(q => /:off$|:flat$/.test(q.key)) || model.quotes[0];
    const bestMetered = mainQuote ? mainQuote.blended : null;
    let gap = '';
    if(bestPlan != null && bestMetered != null && bestPlan > 0){
      gap = `<div class="gapbar">
        <span>套餐最低 <b>¥${u2(bestPlan)}</b></span>
        <span>官方按量 <b>¥${u2(bestMetered)}</b></span>
        <span style="color:var(--accent);font-weight:600">差 ${(bestMetered / bestPlan).toFixed(0)} 倍</span>
      </div>`;
    }

    const vtabs = catalog.map(v => `<div class="tab ${v.name === vendor.name ? 'on' : ''}" data-v="${esc(v.name)}">${esc(v.name)}</div>`).join('');
    const chips = vendor.models.map(mh => `<div class="chip ${mh.id === model.id ? 'on' : ''}" data-x="${esc(mh.id)}">${esc(mh.label)}</div>`).join('');

    const changedKeys = new Set(C.changes.map(c => c.key));
    const tag = changedKeys.size ? `${changedKeys.size} 个口径调价` : '今日无调价';

    return `<div class="card">
      <div class="ch"><span class="idx">2</span><h2>模型价格对比</h2><span class="more">${esc(tag)}</span></div>
      <div class="tabs" id="vtabs">${vtabs}</div>
      <div class="chips" id="mtabs">${chips}</div>
      <div class="seg">
        <button data-o="promo" class="${curOrder === 'promo' ? 'on' : ''}">按活动/当前价</button>
        <button data-o="normal" class="${curOrder === 'normal' ? 'on' : ''}">按常态刊例价</button>
      </div>
      <div class="cb">
        <div class="hint" style="padding-top:4px">同一把尺子：元/百万 Token。按量随用随付；套餐预买额度，折算按额度用满计。</div>
        ${gap}
        ${body}
        <div class="hint" style="padding:10px 0 0">${model.rows.length} 个销售渠道 · ${model.quotes.length} 个官方按量口径${model.rows.length ? '；套餐数据为人工维护，按量数据每日自动抓取' : ''}</div>
              </div>
    </div>`;
  }

  function sourceCard(){
    const h = D.health || {};
    const aTot = (h.aOk || 0) + (h.aFail || 0);
    const bTot = (h.bOk || 0) + (h.bFail || 0);
    const changed = (D.watch || []).filter(w => w.changed);

    const aRows = (D.sources || []).map(s => {
      const st = s.status === 'ok' ? 'ok' : (s.status === 'dynamic' ? 'dynamic' : 'fail');
      return `<div class="wt"><i class="st ${st}"></i>
        <span class="nm"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></span>
        <span class="rs">${s.status === 'ok' ? '自动 · ' + (s.items || 0) + ' 项' : (s.error || '解析失败')}</span></div>`;
    }).join('');

    const bRows = (D.watch || []).map(w => {
      const st = w.status === 'ok' ? 'ok' : (w.status === 'dynamic' ? 'dynamic' : 'fail');
      const rs = w.status === 'ok' ? (w.changed ? '页面有变更' : `${w.signals} 处价格表述`)
        : w.status === 'dynamic' ? '动态渲染' : (w.error || '抓取失败');
      return `<div class="wt"><i class="st ${st}"></i>
        <span class="nm"><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.name)}</a></span>
        <span class="rs ${w.changed ? 'chg' : ''}">${rs}</span></div>`;
    }).join('');

    const orRows = (D.openrouterRef || []).slice(0, 8).map(o =>
      `<div class="wt"><i class="st ok"></i><span class="nm" style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px">${esc(o.id)}</span>
        <span class="rs">¥${u2(o.blendedCny)}/百万</span></div>`).join('');

    return `<div class="card">
      <div class="ch"><span class="idx">3</span><h2>数据来源与变更监控</h2>
        <span class="more">A ${h.aOk || 0}/${aTot} · B ${h.bOk || 0}/${bTot}</span></div>
      <div class="cb">
        ${changed.length ? `<div class="gapbar" style="border-color:rgba(224,118,28,.3);background:rgba(224,118,28,.06)">
          <span style="color:var(--accent);font-weight:600">今日 ${changed.length} 个 B 级源页面有变更</span>
          <span style="color:var(--tx2)">需人工核对后更新数据</span></div>` : ''}
        <div class="chline" style="margin-top:6px"><span>A 级源 · 每日自动抓取数值</span><span style="color:var(--tx3)">${aTot} 个</span></div>
        ${aRows}
        <div class="chline" style="margin-top:12px"><span>B 级源 · 仅监控页面变更</span><span style="color:var(--tx3)">${bTot} 个</span></div>
        <div class="hint" style="padding:2px 0 4px">这些页面由前端渲染或需登录，抓不到稳定价格字段。系统每日比对其正文中的价格表述，变了会标注，数值需人工复核。</div>
        ${bRows}
        ${orRows ? `<details><summary>OpenRouter 聚合参考价（第三方口径）</summary>${orRows}
          <div class="hint">按 1 USD = ${D.fx.usdCny} CNY 折算，用于交叉校验官方报价是否偏离市场水平。</div></details>` : ''}
        <details><summary>计算口径</summary>
          <div class="src">${esc(D.method.unitFromPlan)}</div>
          <div class="src">${esc(D.method.blended)}</div>
          <div class="src">${esc(D.method.measured)}</div>
          <div class="src">${esc(D.method.freshness)}</div>
        </details>
      </div>
      <div class="cb"><button class="btn" id="share">复制分享链接</button></div>
    </div>`;
  }

  function cloudBanner(){
    if(!CLOUD.note) return '';
    return `<div class="card" style="border-color:rgba(207,63,50,.3)"><div class="cb" style="padding:11px 14px">
      <div class="hint" style="padding:0">${esc(CLOUD.note)}</div></div></div>`;
  }

  function render(){
    $('#app').innerHTML = cloudBanner()+head()+rankCard()+priceCard()+sourceCard();
    document.querySelectorAll('#vtabs .tab').forEach(t=>t.onclick=()=>{
      curVendor=t.dataset.v;
      const cs=buildCatalog().find(x=>x.name===curVendor);
      curModelId=cs && cs.models[0] ? cs.models[0].id : curModelId;
      render();
    });
    document.querySelectorAll('#mtabs .chip').forEach(c=>c.onclick=()=>{curModelId=c.dataset.x;render();});
    document.querySelectorAll('#rtabs .chip').forEach(c=>c.onclick=()=>{rankFilter=c.dataset.r;rankExpanded=false;render();});
    const rm = $('#rankMore');
    if(rm) rm.onclick=()=>{rankExpanded=!rankExpanded;render();};
    document.querySelectorAll('.quote').forEach(el=>el.onclick=(e)=>{
      if(e.target.closest('.detail') || e.target.closest('a')) return;
      el.classList.toggle('open');
      const cp=el.querySelector('.caret');
      if(cp) cp.textContent = el.classList.contains('open') ? '▴' : '▾';
    });
    // (trend tabs removed).forEach(t=>t.onclick=()=>{trendSel=t.dataset.t;render();});
    document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{curOrder=b.dataset.o;render();});

    const sb = $('#share');
    if(sb) sb.onclick = async ()=>{
      const url = location.href;
      try{
        if(navigator.share){ await navigator.share({title:'AI算力资源价格监测',url}); }
        else { await navigator.clipboard.writeText(url); sb.textContent='链接已复制'; }
      }catch(e){ sb.textContent='复制失败，请手动复制'; }
    };
  }
  render();
  loadCloud();
})();
</script>
</body>
</html>
