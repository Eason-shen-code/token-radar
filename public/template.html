<style>
:root{
  --bg:#050506; --surface:#0A0A0C; --surface2:#0E0E10;
  --stroke:#232326; --stroke2:#17171A;
  --t1:#FFFFFF; --t2:#8A8A8C; --t3:#4A4A4E;
  --up:#C24B3A; --down:#6E9E5A; --amber:#E2571B;
  /* 旧变量别名：图表与内联样式仍在引用 */
  --tx:var(--t1); --tx2:var(--t2); --tx3:var(--t3);
  --line:var(--stroke2); --accent:var(--amber); --card2:#0E0E10;
  --r:22px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
}

  content:"";position:fixed;top:-140px;left:50%;transform:translateX(-50%);
  width:420px;height:280px;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center,rgba(42,10,18,.55) 0%,rgba(42,10,18,0) 70%);
}
.wrap{max-width:520px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* 顶部 */
.top{padding:calc(16px + env(safe-area-inset-top)) 0 4px}
.meta{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.18em;color:var(--t2);text-transform:uppercase}

.meta .live{display:inline-flex;align-items:center;gap:5px;margin-left:auto}
.meta .live i{width:5px;height:5px;border-radius:50%;background:var(--status,#8BC34A);display:inline-block}
.top h1{font-size:23px;font-weight:500;letter-spacing:-.01em;margin-top:9px}
.card.hero{margin-top:18px}

/* 卡片 */
.card{
  background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r);
  margin:12px 0;padding:18px 18px 16px;position:relative;
}
.ch{display:flex;align-items:baseline;gap:10px;padding-bottom:14px}
.ch .idx{font-size:9.5px;letter-spacing:.14em;color:var(--t3);font-variant-numeric:tabular-nums}
.ch h2{font-size:13px;font-weight:500;color:var(--t1);flex:1;letter-spacing:.01em}
.ch .more{font-size:9.5px;letter-spacing:.14em;color:var(--t3);text-transform:uppercase}
.cb{padding:0}
.hint{font-size:10.5px;color:var(--t3);line-height:1.7}

/* 主卡：点阵读数 */
.hero{padding-bottom:14px}
.hlabel{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--t2);letter-spacing:.04em}
.hlabel svg{flex:0 0 auto}
.hnum{margin:14px 0 2px;display:flex;align-items:flex-end}
.hnum svg{display:block;width:auto;height:64px}
.hunit{font-size:10px;color:var(--t2);letter-spacing:.06em;margin-top:6px}
.hnote{font-size:10px;color:var(--t3);margin-top:2px;letter-spacing:.02em}

/* 价格分布刻度 */
.strip{margin-top:18px;position:relative;height:42px}
.strip .axis{position:absolute;left:0;right:0;top:16px;height:1px;background:var(--stroke2)}
.strip .pt{position:absolute;top:14px;width:3px;height:5px;border-radius:1px;background:#3A3A3E;transform:translateX(-50%)}
.strip .pt.hi{background:var(--t1);width:3px;height:14px;top:8px}
.strip .lbl{position:absolute;font-size:8.5px;color:var(--t3);letter-spacing:.08em;top:26px;transform:translateX(-50%);font-variant-numeric:tabular-nums}

/* 两张次卡 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.sub{background:var(--surface);border:1px solid var(--stroke);border-radius:18px;padding:14px}
.slabel{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--t2)}
.snum{font-size:30px;font-weight:300;letter-spacing:-.02em;margin-top:12px;line-height:1;font-variant-numeric:tabular-nums}
.snum small{font-size:10px;font-weight:400;color:var(--t2);letter-spacing:.06em;margin-left:5px}

.segs i.ok,.segs i.a{background:#B4B4B8}

/* 标签条 */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}

}

/* 列表行 */

.caret{flex-shrink:0;color:var(--t3);font-size:9px;line-height:1}
.bar{height:1px;background:var(--stroke2);margin:9px 0 8px;overflow:hidden}

.bar i.meter{background:#FFFFFF}

.qm{font-size:9.5px;color:var(--t3);display:flex;flex-wrap:wrap;gap:2px 10px;letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* 来源标签 */
.src-tag{display:inline-block;font-size:8.5px;letter-spacing:.12em;padding:1px 5px;border:1px solid var(--stroke);border-radius:3px;margin-right:6px;vertical-align:1.5px;color:var(--t3);text-transform:uppercase}
.src-tag.live{color:var(--t2)}

.tag{display:inline-block;font-size:8.5px;letter-spacing:.1em;padding:0;border:0;color:var(--t3);margin-left:6px;vertical-align:1.5px}
.tag.on-amber{color:var(--amber)}
.tag.on-amber::before{content:'';display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--amber);margin-right:4px;vertical-align:2px}
.tag.base,.tag.pend{color:var(--t3)}
.tag.no{color:var(--up);border-color:#3A2320}
.badge{display:inline-block;font-size:9px;letter-spacing:.04em;margin-left:7px;vertical-align:1px;font-variant-numeric:tabular-nums}
.badge.up{color:var(--up)}
.badge.down{color:var(--down)}

/* 排行行 */
.rankwrap{padding:12px 0;border-bottom:1px solid var(--stroke2);cursor:pointer}
.rankwrap:last-of-type{border-bottom:0}
.rank{display:flex;gap:10px;align-items:flex-start;padding:0}
.rn{width:18px;flex:0 0 18px;font-size:9.5px;color:var(--t3);text-align:right;padding-top:3px;font-variant-numeric:tabular-nums}
.rt{font-size:12.5px;color:var(--t1);line-height:1.4}
.rt .plat{color:var(--t3);font-size:10.5px;margin-left:4px}
.rs2{font-size:9.5px;color:var(--t3);margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.rbar{height:1px;background:var(--stroke2);margin-top:8px;overflow:hidden}
.rbar i{display:block;height:1px;background:#EDEDED}
.rbar i.plan{background:#7A7A7E}
.rp{font-size:13.5px;font-weight:400;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rp span{font-size:9px;color:var(--t2);margin-left:3px;white-space:nowrap}

/* 统计条 */
.gapbar{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:10px;color:var(--t2);padding:0 0 12px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.gapbar b{color:var(--t1);font-weight:400}

/* 展开明细 */
.detail{display:none;padding-top:2px;cursor:default}
.quote.open .detail,.rankwrap.open .detail{display:block}
.chline{display:flex;justify-content:space-between;font-size:9.5px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase;margin:12px 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:9.5px;color:var(--t3);margin-top:6px;letter-spacing:.04em}
.legend i{display:inline-block;width:8px;height:1px;vertical-align:middle;margin-right:4px}
.chartbox{border:1px solid var(--stroke2);border-radius:12px;padding:12px;margin:10px 0}

/* 活动区块 */
.promo{border:1px solid var(--stroke);border-radius:14px;padding:13px 14px;margin:6px 0 2px}
.promo .ptitle{font-size:10px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;margin-bottom:5px}
.promo .pname{font-size:12px;color:var(--t1);margin-bottom:9px;line-height:1.45}
.kv{display:flex;gap:10px;font-size:10.5px;padding:3px 0;font-variant-numeric:tabular-nums}
.kv span{color:var(--t3);flex:0 0 78px;letter-spacing:.02em}
.kv b{color:var(--t1);font-weight:400;flex:1;word-break:break-word}
.plinks{display:flex;gap:16px;margin-top:9px;font-size:10px;letter-spacing:.04em}
.plinks a{color:var(--t2);text-decoration:none;border-bottom:1px solid var(--stroke);padding-bottom:1px}

/* 源列表 */
.wt{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--stroke2);font-size:11px}
.wt:last-child{border-bottom:0}
.wt .st{width:4px;height:4px;border-radius:50%;flex-shrink:0;background:#3A3A3E}
.wt .st.ok{background:#6E9E5A}
.wt .st.dynamic{background:#8A8A8C}
.wt .st.fail{background:var(--up)}
.wt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2)}
.wt .nm a{color:inherit;text-decoration:none}
.wt .rs{font-size:9.5px;color:var(--t3);white-space:nowrap;letter-spacing:.04em}
.wt .rs.chg{color:var(--amber)}

/* 折叠与按钮 */
details{border-top:1px solid var(--stroke2);margin-top:4px}
details summary{list-style:none;cursor:pointer;padding:12px 0;font-size:10.5px;color:var(--t2);display:flex;justify-content:space-between;letter-spacing:.04em}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';color:var(--t3)}
details[open] summary::after{content:'−'}
.src{font-size:10px;color:var(--t3);padding:6px 0;border-bottom:1px solid var(--stroke2);line-height:1.7}
.src:last-child{border-bottom:0}
.btn{
  display:flex;align-items:center;gap:12px;width:100%;margin-top:6px;padding:0 18px;
  height:56px;border-radius:28px;border:1px solid var(--stroke);background:transparent;
  color:var(--t1);font-size:12px;letter-spacing:.04em;cursor:pointer;text-align:left;
  font-family:inherit;
}
.btn::before{content:'';width:32px;height:32px;border-radius:50%;background:#FFF;flex:0 0 32px}
#share::after{content:'LINK READY';margin-left:auto;font-size:8.5px;letter-spacing:.16em;color:var(--t3)}
.btn:active{opacity:.8}
.foot{text-align:left;font-size:9px;color:var(--t3);padding:20px 0 8px;line-height:1.9;letter-spacing:.06em}
@media(min-width:760px){.wrap{max-width:560px}}
</style>

<body>

<div class="top">
  <div class="wrap">
    <div class="meta">
      <span id="datemeta">—</span>
      <span class="live"><i id="cloudDot"></i><span id="cloudTag">SYNCING</span></span>
    </div>
    <h1>AI算力价格监测台</h1>
  </div>
</div>

<div class="wrap">
  <div id="app"></div>
  <div class="foot">
    价格数据由脚本自动抓取自各平台官方文档页<br>
    抓取与分析口径见文末说明 · 仅供内部比价参考
  </div>
</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function(){
  const D = JSON.parse(document.getElementById('payload').textContent);
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // 单价：元/百万Token，固定两位
  const u2 = v => (v==null||isNaN(v)) ? '—' : Number(v).toFixed(2);
  // 金额：月费等，去掉无意义的尾零
  const money = v => {
    if(v==null||isNaN(v)) return '—';
    const a=Math.abs(v);
    if(a>=1000) return Number(v).toLocaleString('zh-CN',{maximumFractionDigits:0});
    if(a>=100) return Number(v).toFixed(1).replace(/\.0$/,'');
    return Number(v).toFixed(2).replace(/0$/,'').replace(/\.$/,'');
  };


  /* ---------------- 云服务：价格历史 ---------------- */
  const CFG = window.__CLOUD_CFG || {};
  const CLOUD = { status: 'loading', note: '', snaps: [], trend: [] };
  const num = v => (v == null || v === '' || isNaN(Number(v))) ? null : Number(v);

  function setCloud(state, text){
    const dot = $('#cloudDot'), tag = $('#cloudTag');
    if(!dot || !tag) return;
    dot.style.background = state === 'ok' ? '#8BC34A' : (state === 'loading' ? '#8A8A8C' : '#C24B3A');
    tag.textContent = text;
  }

  function computeCompare(histRows, todayQuotes, todayDate){
    const EPS = 0.0001;
    if(!histRows || !histRows.length) return null;
    const dates = [...new Set(histRows.map(x => x.date))].sort().reverse();
    const prevDate = dates.find(d => d < todayDate);
    if(!prevDate) return null;

    const byKey = new Map();
    histRows.forEach(r => {
      if(!byKey.has(r.key)) byKey.set(r.key, []);
      byKey.get(r.key).push(r);
    });
    byKey.forEach(arr => arr.sort((a, b) => b.date.localeCompare(a.date)));

    const prevOf = k => (byKey.get(k) || []).find(x => x.date === prevDate);
    const pctOf = (a, b) => (a ? Math.round((b - a) / a * 1000) / 10 : null);

    const changes = [];
    todayQuotes.forEach(q => {
      const p = prevOf(q.key);
      if(!p) return;
      [['官方综合单价', q.blended, p.blended],
       ['输入价', q.input, p.input],
       ['输出价', q.output, p.output],
       ['缓存命中价', q.inputCacheHit, p.cacheHit]].forEach(([name, cur, old]) => {
        if(cur == null || old == null || Math.abs(cur - old) <= EPS) return;
        changes.push({ key:q.key, label:q.label, field:name, from:old, to:cur, pct:pctOf(old, cur), kind: cur > old ? 'up' : 'down' });
      });
    });

    const streaks = [];
    todayQuotes.forEach(q => {
      const arr = (byKey.get(q.key) || []).filter(x => x.date < todayDate);
      if(q.blended == null) return;
      let days = 1, since = todayDate;
      for(const h of arr){
        if(h.blended != null && Math.abs(h.blended - q.blended) <= EPS){ days++; since = h.date; }
        else break;
      }
      if(days >= 2) streaks.push({ key:q.key, label:q.label, days, since, blended:q.blended });
    });
    streaks.sort((a, b) => b.days - a.days || a.blended - b.blended);

    return { available:true, lastDate:prevDate, lastLabel:'上一次抓取 ' + prevDate, changes, streaks, note:null };
  }

  async function loadCloud(){
    if(!window.WorkBuddyCloud || !CFG.endpoint || !CFG.publishableKey){
      CLOUD.status = 'fail';
      CLOUD.note = '云端客户端未加载，当前展示页面内置快照';
      setCloud('err', 'OFFLINE');
      render();
      return;
    }
    try{
      const cloud = WorkBuddyCloud.createWorkBuddyCloud({
        endpoint: CFG.endpoint,
        oauthRelayBaseUrl: CFG.oauthRelayBaseUrl,
        publishableKey: CFG.publishableKey
      });
      const db = cloud.database;

      const r1 = await db.from('price_snapshots')
        .select('as_of_date,stamp,baseline_version,quote_count,diff_count,a_ok,a_fail,b_ok,b_fail')
        .order('as_of_date', { ascending: false }).limit(30);
      if(r1.error) throw r1.error;

      const snaps = (r1.data || []).map(s => Object.assign({}, s, { date: String(s.as_of_date).slice(0, 10) }));
      if(!snaps.length){
        CLOUD.status = 'empty';
        CLOUD.note = '云端尚无历史快照，当前展示页面内置数据';
        setCloud('warn', 'NO DATA');
        render();
        return;
      }

      const latest = snaps[0].date;
      const [rq, rt] = await Promise.all([
        db.from('price_quotes').select('*').eq('as_of_date', latest).order('blended', { ascending: true }),
        db.from('price_quotes').select('as_of_date,quote_key,label,input_price,cache_hit_price,output_price,blended').order('as_of_date', { ascending: true }).limit(800)
      ]);
      if(rq.error) throw rq.error;

      const quotes = (rq.data || []).map(r => ({
        key: r.quote_key, label: r.label, source: r.source, billing: r.billing,
        input: num(r.input_price), inputCacheHit: num(r.cache_hit_price),
        output: num(r.output_price), blended: num(r.blended), unit: r.unit
      })).filter(q => q.blended != null);

      if(quotes.length) D.liveQuotes = quotes;
      D.stamp = snaps[0].stamp || D.stamp;
      D.health = {
        aOk: snaps[0].a_ok || 0, aFail: snaps[0].a_fail || 0,
        bOk: snaps[0].b_ok || 0, bFail: snaps[0].b_fail || 0
      };

      CLOUD.snaps = snaps;
      const histRows = (rt.data || []).map(r => ({
        date: String(r.as_of_date).slice(0, 10), key: r.quote_key, label: r.label,
        input: num(r.input_price), cacheHit: num(r.cache_hit_price),
        output: num(r.output_price), blended: num(r.blended)
      }));
      CLOUD.trend = histRows.filter(x => x.blended != null).map(x => ({ date: x.date, key: x.key, v: x.blended }));

      // 本期变动由云端历史现算，不依赖页面构建时间
      const cmp = computeCompare(histRows, quotes, latest);
      if(cmp) D.compare = cmp;
      CLOUD.status = 'ok';
      CLOUD.note = '';

          setCloud('ok', 'SYNCED');
      render();
    }catch(e){
      let msg = e && (e.message || e.hint || e.error_description || e.error || e.code);
      if(!msg){ try { msg = JSON.stringify(e).slice(0, 90); } catch(_) { msg = ''; } }
      if(!msg) msg = '网络或凭证异常';
      CLOUD.status = 'fail';
      CLOUD.note = '云端读取失败（' + msg + '），已回退到页面内置快照';
      setCloud('err', 'OFFLINE');
      render();
    }
  }

  const VER = {
    measured:  ['base', '已实测'],
    nominal:   ['base', '标称口径'],
    unverified:['pend', '未实测'],
    pending:   ['pend', '待实测'],
    unsupported:['no', '不支持']
  };

  let curOrder = 'promo';

  function unitOf(r){ return curOrder==='normal' ? (r.unitPriceNormal ?? r.unitPrice) : (r.unitPrice ?? r.unitPriceNormal); }

  const DOTGLYPH = {
    '0':['01110','10001','10001','10001','10001','10001','01110'],
    '1':['00100','01100','00100','00100','00100','00100','01110'],
    '2':['01110','10001','00001','00010','00100','01000','11111'],
    '3':['11111','00010','00100','00010','00001','10001','01110'],
    '4':['00010','00110','01010','10010','11111','00010','00010'],
    '5':['11111','10000','11110','00001','00001','10001','01110'],
    '6':['00110','01000','10000','11110','10001','10001','01110'],
    '7':['11111','00001','00010','00100','01000','01000','01000'],
    '8':['01110','10001','10001','01110','10001','10001','01110'],
    '9':['01110','10001','10001','01111','00001','00010','01100'],
    '.':['00000','00000','00000','00000','00000','00000','00110'],
    ':':['00000','00110','00110','00000','00110','00110','00000']
  };

  function dotMatrix(str){
    const cell = 12, r = 3.3;
    const chars = String(str).split('');
    let x = 0, body = '';
    chars.forEach(ch => {
      const g = DOTGLYPH[ch] || DOTGLYPH['.'];
      for(let row = 0; row < 7; row++){
        for(let col = 0; col < 5; col++){
          if(g[row][col] !== '1') continue;
          body += '<circle cx="' + (x + col * cell + cell / 2) + '" cy="' + (row * cell + cell / 2) + '" r="' + r + '" fill="#FFFFFF"/>';
        }
      }
      x += 5 * cell + cell;
    });
    const w = chars.length * 5 * cell + (chars.length - 1) * cell;
    return '<svg viewBox="0 0 ' + w + ' 70" width="' + w + '" height="70" aria-hidden="true">' + body + '</svg>';
  }

  const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function metaLine(stamp){
    const m = String(stamp || '').match(/(\d{4})-(\d{2})-(\d{2})\s*(\d{2}:\d{2})?/);
    if(!m) return String(stamp || '—');
    const d = new Date(m[1] + '-' + m[2] + '-' + m[3] + 'T00:00:00');
    return DOW[d.getDay()] + ', ' + m[3] + ' ' + MON[d.getMonth()] + (m[4] ? ' · ' + m[4] : '');
  }

  function collectItems(){
    const out = [];
    (D.models || []).forEach(fam => (fam.rows || []).forEach(r => {
      const v = unitOf(r);
      if(v == null) return;
      out.push({
        kind:'plan', price:v, model:r.modelLabel || fam.name, where:r.platform, ref:r, promo:!!r.promo,
        sub:[r.product, r.priceMonthly != null ? '¥' + money(r.priceMonthly) + '/月' : '',
          r.monthlyTokens ? (r.monthlyTokens / 1e8).toFixed(1) + '亿' : ''].filter(Boolean).join(' · ')
      });
    }));
    (D.liveQuotes || []).forEach(q => {
      if(q.blended == null) return;
      const meta = QUOTE_META[q.key];
      out.push({
        kind:'meter', price:q.blended, model:(meta ? meta[2] : q.label) + quoteSuffix(q.label),
        where:'官方 API', ref:q, promo:false,
        sub:'输入 ¥' + u2(q.input) + ' · 输出 ¥' + u2(q.output)
      });
    });
    return out.sort((a, b) => a.price - b.price);
  }

  function heroCard(){
    const C = D.compare || { available:false, changes:[], streaks:[] };
    const h = D.health || {};
    const items = collectItems();
    if(!items.length) return '';
    const min = items[0], max = items[items.length - 1];
    const hi = C.available ? new Set(C.changes.map(c => c.key)).size : 0;

    const lnMin = Math.log(min.price) || 0;
    const lnMax = Math.log(max.price) || 1;
    const span = (lnMax - lnMin) || 1;
    const ticks = items.map(it => {
      const pos = 2 + (Math.log(it.price) - lnMin) / span * 96;
      return '<i class="pt' + (it === min ? ' hi' : '') + '" style="left:' + pos.toFixed(1) + '%"></i>';
    }).join('');

    const okA = h.aOk || 0, totA = okA + (h.aFail || 0);
    const okB = h.bOk || 0, totB = okB + (h.bFail || 0);
    let segs = '';
    for(let i = 0; i < totA; i++) segs += '<i class="' + (i < okA ? 'a' : 'bad') + '"></i>';
    for(let i = 0; i < totB; i++) segs += '<i class="' + (i < okB ? 'ok' : 'bad') + '"></i>';

    const streak = (C.streaks || [])[0];

    return '<div class="card hero">'
      + '<div class="hlabel"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#8A8A8C" stroke-width="1.2"><path d="M2 9l3.5-4L8 7.5 11.5 3"/></svg>最低可及单价</div>'
      + '<div class="hnum">' + dotMatrix(u2(min.price)) + '</div>'
      + '<div class="hunit">元 / 百万 token</div>'
      + '<div class="hnote">' + esc(min.model) + ' · ' + esc(min.where) + (min.promo ? ' · 含活动价' : '') + '</div>'
      + '<div class="strip"><div class="axis"></div>' + ticks
      + '<span class="lbl" style="left:2%">' + u2(min.price) + '</span>'
      + '<span class="lbl" style="left:98%">' + u2(max.price) + '</span></div>'
      + '<div class="hnote" style="margin-top:10px">' + items.length + ' 个在售口径 · 对数刻度 · 白点为最低值</div>'
      + '</div>'
      + '<div class="duo">'
      + '<div class="sub"><div class="slabel"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#8A8A8C" stroke-width="1.2"><circle cx="6" cy="6" r="4.5"/><path d="M6 3.5V6l2 1.2"/></svg>今日调价</div>'
      + '<div class="snum">' + hi + '<small>个口径</small></div>'
      + '<div class="snote">' + (streak ? '最长 ' + streak.days + ' 天未变' : '暂无变化') + '</div></div>'
      + '<div class="sub"><div class="slabel"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#8A8A8C" stroke-width="1.2"><path d="M1.5 8.5v-3M4.5 8.5v-5M7.5 8.5v-2M10.5 8.5v-4"/></svg>抓取源</div>'
      + '<div class="snum">' + (okA + okB) + '<small>/ ' + (totA + totB) + '</small></div>'
      + '<div class="segs">' + segs + '</div></div>'
      + '</div>';
  }

  function keySeries(k){
    return (CLOUD.trend || []).filter(x => x.key === k).sort((a, b) => a.date.localeCompare(b.date));
  }

  function miniChart(pts, color){
    if(pts.length < 2) return '<div class="hint" style="padding:6px 0">云端历史不足 2 次记录，暂无法绘制走势。</div>';
    const W = 300, H = 96, PL = 34, PR = 8, PT = 12, PB = 20;
    const vs = pts.map(p => p.v);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    const span = (hi - lo) || (hi * 0.4) || 1;
    lo = Math.max(0, lo - span * 0.2); hi = hi + span * 0.2;
    const X = i => PL + i * (W - PL - PR) / (pts.length - 1);
    const Y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
    const poly = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
    const grid = [lo, hi].map(v =>
      `<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W - PR}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
       <text x="${PL - 5}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--tx3)">${v.toFixed(2)}</text>`
    ).join('');
    const dots = pts.map((p, i) =>
      `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 3 : 1.8}" fill="${color}"/>`).join('');
    const xl = `<text x="${PL}" y="${H - 6}" font-size="8" fill="var(--tx3)">${pts[0].date.slice(5)}</text>
      <text x="${W - PR}" y="${H - 6}" text-anchor="end" font-size="8" fill="var(--tx3)">${pts[pts.length - 1].date.slice(5)}</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}
      <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
  }

  const QUOTE_META = {
    'zhipu:GLM-5.3':                ['智谱', 'glm-5.3', 'GLM-5.3'],
    'zhipu:GLM-5.3-Flash':          ['智谱', 'glm-5.3-flash', 'GLM-5.3-Flash'],
    'zhipu:GLM-5.3-FlashX':         ['智谱', 'glm-5.3-flashx', 'GLM-5.3-FlashX'],
    'deepseek:deepseek-v4-pro:off':   ['DeepSeek', 'deepseek-v4-pro', 'V4 Pro'],
    'deepseek:deepseek-v4-pro:peak':  ['DeepSeek', 'deepseek-v4-pro', 'V4 Pro'],
    'deepseek:deepseek-v41-flash:off':  ['DeepSeek', 'deepseek-v41-flash', 'V4.1 Flash'],
    'deepseek:deepseek-v41-flash:peak': ['DeepSeek', 'deepseek-v41-flash', 'V4.1 Flash']
  };
  const VENDOR_ORDER = ['智谱', 'DeepSeek', '字节跳动', '阿里', '月之暗面'];

  let curVendor = '智谱';
  let curModelId = 'glm-5.3';

  function buildCatalog(){
    const vendors = new Map();
    const touch = (v, mid, label) => {
      if(!vendors.has(v)) vendors.set(v, new Map());
      const ms = vendors.get(v);
      if(!ms.has(mid)) ms.set(mid, { id: mid, label, rows: [], quotes: [] });
      return ms.get(mid);
    };

    (D.models || []).forEach(fam => (fam.rows || []).forEach(r => {
      const v = r.vendor || '其他';
      const mid = r.model || fam.id;
      const lab = r.modelLabel || fam.name || mid;
      touch(v, mid, lab).rows.push(r);
    }));

    (D.liveQuotes || []).forEach(q => {
      const meta = QUOTE_META[q.key];
      if(!meta) return;
      touch(meta[0], meta[1], meta[2]).quotes.push(q);
    });

    const list = [...vendors.entries()].map(([name, ms]) => ({
      name,
      models: [...ms.values()].sort((a, b) => {
        const av = [...a.rows.map(unitOf), ...a.quotes.map(q => q.blended)].filter(x => x != null).sort((x, y) => x - y)[0];
        const bv = [...b.rows.map(unitOf), ...b.quotes.map(q => q.blended)].filter(x => x != null).sort((x, y) => x - y)[0];
        return (av ?? 1e9) - (bv ?? 1e9);
      })
    }));
    list.sort((a, b) => {
      const ai = VENDOR_ORDER.indexOf(a.name), bi = VENDOR_ORDER.indexOf(b.name);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
    return list;
  }

  function meterDetail(q, C){
    const mine = C.changes.filter(c => c.key === q.key);
    const main = mine.find(c => c.field === '官方综合单价') || mine[0];
    const pts = keySeries(q.key);
    const svg = pts.length >= 2 ? miniChart(pts, main ? (main.kind === 'up' ? 'var(--up)' : 'var(--down)') : '#e0761c') : '';
    const det = mine.filter(c => c !== main).map(c =>
      `<div class="wt"><i class="st ok"></i><span class="nm">${esc(c.field)}</span>
        <span class="rs" style="color:${c.kind === 'up' ? 'var(--up)' : 'var(--down)'}">¥${u2(c.from)} → ¥${u2(c.to)} · ${c.pct > 0 ? '+' : ''}${c.pct}%</span></div>`).join('');

    return `${svg ? `<div class="chline"><span>官方综合单价走势</span><span style="color:var(--tx3)">近 30 天窗口 · 已存档 ${pts.length} 天</span></div>${svg}
        ${pts.length >= 2 && pts.every(x => Math.abs(x.v - pts[0].v) < 1e-4)
          ? `<div class="hint" style="padding:2px 0 0">窗口内价格全程未变，恒定 ¥${u2(pts[0].v)}。</div>` : ''}`
      : `<div class="hint" style="padding:2px 0 6px">历史记录不足 2 天，暂无法绘制走势。</div>`}
      ${main ? `<div class="hint" style="padding:8px 0 2px">与${esc(C.lastLabel || '上一次抓取')}相比，本口径共 ${mine.length} 项调整：</div>${det}`

      <div class="hint" style="padding:8px 0 0">套餐价格为人工维护的报价快照，不是每日抓取，因此没有走势曲线。销售渠道：${esc(r.platform)}。</div>`;
  }

      });

  function priceCard(){

    if(!vendor) return '';
    let model = vendor.models.find(x => x.id === curModelId) || vendor.models[0];
    if(!model) return '';
    curVendor = vendor.name; curModelId = model.id;

    const ordered = [
      ...model.quotes.map(q => ({ kind: 'm', v: q.blended, q })),
      ...model.rows.map(r => ({ kind: 'p', v: unitOf(r), r }))
    ].sort((a, b) => {
      if(a.v == null && b.v == null) return 0;
      if(a.v == null) return 1;
      if(b.v == null) return -1;
      return a.v - b.v;
    });
    const prices = ordered.map(o => o.v).filter(v => v != null);
    const maxAll = prices.length ? Math.max(...prices) : 1;
    const body = ordered.map(o => o.kind === 'm' ? meteredRow(o.q, C, maxAll) : planRow(o.r, maxAll)).join('');

    const bestPlan = model.rows.map(unitOf).filter(v => v != null).sort((a, b) => a - b)[0];
    const mainQuote = model.quotes.find(q => /:off$|:flat$/.test(q.key)) || model.quotes[0];
    const bestMetered = mainQuote ? mainQuote.blended : null;
    let gap = '';
    if(bestPlan != null && bestMetered != null && bestPlan > 0){
      gap = `<div class="gapbar">
        <span>套餐最低 <b>¥${u2(bestPlan)}</b></span>
        <span>官方按量 <b>¥${u2(bestMetered)}</b></span>
        <span style="color:var(--accent);font-weight:600">差 ${(bestMetered / bestPlan).toFixed(0)} 倍</span>
      </div>`;
    }

    const vtabs = catalog.map(v => `<div class="tab ${v.name === vendor.name ? 'on' : ''}" data-v="${esc(v.name)}">${esc(v.name)}</div>`).join('');
    const chips = vendor.models.map(mh => `<div class="chip ${mh.id === model.id ? 'on' : ''}" data-x="${esc(mh.id)}">${esc(mh.label)}</div>`).join('');

    const changedKeys = new Set(C.changes.map(c => c.key));
    const tag = changedKeys.size ? `${changedKeys.size} 个口径调价` : '今日无调价';

    return `<div class="card">
      <div class="ch"><span class="idx">2</span><h2>模型价格对比</h2><span class="more">${esc(tag)}</span></div>
      <div class="tabs" id="vtabs">${vtabs}</div>
      <div class="chips" id="mtabs">${chips}</div>
      <div class="seg">
        <button data-o="promo" class="${curOrder === 'promo' ? 'on' : ''}">按活动/当前价</button>
        <button data-o="normal" class="${curOrder === 'normal' ? 'on' : ''}">按常态刊例价</button>
      </div>
      <div class="cb">
        <div class="hint" style="padding-top:4px">同一把尺子：元/百万 Token。按量随用随付；套餐预买额度，折算按额度用满计。</div>
        ${gap}
        ${body}
        <div class="hint" style="padding:10px 0 0">${model.rows.length} 个销售渠道 · ${model.quotes.length} 个官方按量口径${model.rows.length ? '；套餐数据为人工维护，按量数据每日自动抓取' : ''}</div>
              </div>
    </div>`;
  }

  function sourceCard(){
    const h = D.health || {};
    const aTot = (h.aOk || 0) + (h.aFail || 0);
    const bTot = (h.bOk || 0) + (h.bFail || 0);
    const changed = (D.watch || []).filter(w => w.changed);

    const aRows = (D.sources || []).map(s => {
      const st = s.status === 'ok' ? 'ok' : (s.status === 'dynamic' ? 'dynamic' : 'fail');
      return `<div class="wt"><i class="st ${st}"></i>
        <span class="nm"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></span>
        <span class="rs">${s.status === 'ok' ? '自动 · ' + (s.items || 0) + ' 项' : (s.error || '解析失败')}</span></div>`;
    }).join('');

    const bRows = (D.watch || []).map(w => {
      const st = w.status === 'ok' ? 'ok' : (w.status === 'dynamic' ? 'dynamic' : 'fail');
      const rs = w.status === 'ok' ? (w.changed ? '页面有变更' : `${w.signals} 处价格表述`)
        : w.status === 'dynamic' ? '动态渲染' : (w.error || '抓取失败');
      return `<div class="wt"><i class="st ${st}"></i>
        <span class="nm"><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.name)}</a></span>
        <span class="rs ${w.changed ? 'chg' : ''}">${rs}</span></div>`;
    }).join('');

    const orRows = (D.openrouterRef || []).slice(0, 8).map(o =>
      `<div class="wt"><i class="st ok"></i><span class="nm" style="font-family:ui-monospace,Menlo,monospace;font-size:11.5px">${esc(o.id)}</span>
        <span class="rs">¥${u2(o.blendedCny)}/百万</span></div>`).join('');

    return `<div class="card">
      <div class="ch"><span class="idx">3</span><h2>数据来源与变更监控</h2>
        <span class="more">A ${h.aOk || 0}/${aTot} · B ${h.bOk || 0}/${bTot}</span></div>
      <div class="cb">
        ${changed.length ? `<div class="gapbar" style="border-color:rgba(224,118,28,.3);background:rgba(224,118,28,.06)">
          <span style="color:var(--accent);font-weight:600">今日 ${changed.length} 个 B 级源页面有变更</span>
          <span style="color:var(--tx2)">需人工核对后更新数据</span></div>` : ''}
        <div class="chline" style="margin-top:6px"><span>A 级源 · 每日自动抓取数值</span><span style="color:var(--tx3)">${aTot} 个</span></div>
        ${aRows}
        <div class="chline" style="margin-top:12px"><span>B 级源 · 仅监控页面变更</span><span style="color:var(--tx3)">${bTot} 个</span></div>
        <div class="hint" style="padding:2px 0 4px">这些页面由前端渲染或需登录，抓不到稳定价格字段。系统每日比对其正文中的价格表述，变了会标注，数值需人工复核。</div>
        ${bRows}
        ${orRows ? `<details><summary>OpenRouter 聚合参考价（第三方口径）</summary>${orRows}
          <div class="hint">按 1 USD = ${D.fx.usdCny} CNY 折算，用于交叉校验官方报价是否偏离市场水平。</div></details>` : ''}
        <details><summary>计算口径</summary>
          <div class="src">${esc(D.method.unitFromPlan)}</div>
          <div class="src">${esc(D.method.blended)}</div>
          <div class="src">${esc(D.method.measured)}</div>
          <div class="src">${esc(D.method.freshness)}</div>
        </details>
      </div>
      <div class="cb"><button class="btn" id="share">复制分享链接</button></div>
    </div>`;
  }

  function cloudBanner(){
    if(!CLOUD.note) return '';
    return `<div class="card" style="border-color:rgba(207,63,50,.3)"><div class="cb" style="padding:11px 14px">
      <div class="hint" style="padding:0">${esc(CLOUD.note)}</div></div></div>`;
  }

  function render(){
    $('#datemeta').textContent = metaLine(D.stamp);
    $('#app').innerHTML = cloudBanner()+heroCard()+rankCard()+priceCard()+sourceCard();
    document.querySelectorAll('#vtabs .tab').forEach(t=>t.onclick=()=>{
      curVendor=t.dataset.v;
      const cs=buildCatalog().find(x=>x.name===curVendor);
      curModelId=cs && cs.models[0] ? cs.models[0].id : curModelId;
      render();
    });
    document.querySelectorAll('#mtabs .chip').forEach(c=>c.onclick=()=>{curModelId=c.dataset.x;render();});
    document.querySelectorAll('#rtabs .chip').forEach(c=>c.onclick=()=>{rankFilter=c.dataset.r;rankExpanded=false;render();});
    const rm = $('#rankMore');
    if(rm) rm.onclick=()=>{rankExpanded=!rankExpanded;render();};
    document.querySelectorAll('.quote').forEach(el=>el.onclick=(e)=>{
      if(e.target.closest('.detail') || e.target.closest('a')) return;
      el.classList.toggle('open');
      const cp=el.querySelector('.caret');
      if(cp) cp.textContent = el.classList.contains('open') ? '▴' : '▾';
    });
    // (trend tabs removed).forEach(t=>t.onclick=()=>{trendSel=t.dataset.t;render();});
    document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{curOrder=b.dataset.o;render();});

    const sb = $('#share');
    if(sb) sb.onclick = async ()=>{
      const url = location.href;
      try{
        if(navigator.share){ await navigator.share({title:'AI算力资源价格监测',url}); }
        else { await navigator.clipboard.writeText(url); sb.textContent='链接已复制'; }
      }catch(e){ sb.textContent='复制失败，请手动复制'; }
    };
  }
  render();
  loadCloud();
})();
</script>
</body>
</html>
