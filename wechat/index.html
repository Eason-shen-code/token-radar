<style>
:root{
  --bg:#0b1219;--card:#131c26;--card2:#0f1720;--line:#22303f;
  --tx:#e7eef6;--tx2:#96a7ba;--tx3:#6d7f93;
  --accent:#f0952f;--badge:#f0952f;--on-accent:#1c1206;
  --up:#ff6b5e;--down:#31c48d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--tx);line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
}
.box{width:100%;max-width:420px}
.head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.head h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.head .v{font-size:12px;font-weight:700;color:var(--accent)}
.sub{font-size:12.5px;color:var(--tx3);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.stat .k{font-size:10px;color:var(--tx3);margin-bottom:3px}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.5px}
.stat.lo .v{color:var(--down)}
.stat.hi .v{color:var(--up)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  height:52px;border-radius:13px;border:0;cursor:pointer;
  background:var(--accent);color:var(--on-accent);
  font-size:15px;font-weight:700;font-family:inherit;
}
.btn:active{opacity:.86}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:600;margin-top:10px}
.qr{display:flex;flex-direction:column;align-items:center;padding:16px 0 4px}
.qr img{width:190px;height:190px;border-radius:10px;background:#fff;padding:8px;display:block}
.qr .tip{font-size:11.5px;color:var(--tx3);margin-top:12px;text-align:center;line-height:1.7}
.link{font-size:10.5px;color:var(--tx3);word-break:break-all;line-height:1.7;
      background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:14px}
.hint{font-size:11px;color:var(--tx3);text-align:center;line-height:1.8;margin-top:14px}
</style>
